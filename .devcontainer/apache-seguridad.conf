# El proyecto completo se monta en /var/www/html, así que todo sería público.
# Oculta archivos y carpetas internos (credenciales, git, simulación, sincronizador).
RedirectMatch 404 "/\."
RedirectMatch 404 "(?i)^/(simulacion|sync|seguridad|config|core|migraciones|docs)(/|$)"
RedirectMatch 404 "(?i)\.(sql|md|log|sh|txt)$"

# Endpoints que ninguna pantalla usa; predictivo.php además escribe en la base.
RedirectMatch 404 "(?i)^/api/(predictivo|historial)\.php$"

# Cabeceras básicas: sin incrustar la app en otros sitios, sin adivinar tipos de archivo.
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
